
<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Körtid</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  background: #f2f2f7;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  color: #111;
}

.card {
  width: 90%;
  max-width: 420px;
  background: white;
  padding: 28px;
  border-radius: 24px;
  box-shadow: 0 10px 35px rgba(0,0,0,0.12);
}

h1 {
  margin: 0 0 8px;
  font-size: 30px;
}

.intro {
  color: #666;
  margin-bottom: 25px;
}

label {
  display: block;
  font-weight: 600;
  margin-top: 18px;
  margin-bottom: 7px;
}

input {
  width: 100%;
  padding: 15px;
  font-size: 21px;
  border: 1px solid #bbb;
  border-radius: 13px;
}

button {
  width: 100%;
  margin-top: 24px;
  padding: 16px;
  border: none;
  border-radius: 14px;
  background: #007aff;
  color: white;
  font-size: 19px;
  font-weight: bold;
  cursor: pointer;
}

.result {
  margin-top: 22px;
  padding: 20px;
  background: #f2f2f7;
  border-radius: 16px;
  text-align: center;
}

#time {
  font-size: 30px;
  font-weight: bold;
}

#detail {
  margin-top: 7px;
  color: #666;
}
</style>
</head>

<body>

<div class="card">

<h1>🚗 Körtid</h1>

<p class="intro">
Räkna ut körtiden från hastighet och sträcka.
</p>

<label>Hastighet (km/h)</label>
<input id="speed" type="number" placeholder="80">

<label>Sträcka (km)</label>
<input id="distance" type="number" placeholder="120">

<button onclick="calculate()">
Beräkna körtid
</button>

<div class="result">

<div id="time">–</div>

<div id="detail">
Fyll i hastighet och sträcka
</div>

</div>

</div>

<script>

function calculate() {

  const speed =
    parseFloat(document.getElementById("speed").value);

  const distance =
    parseFloat(document.getElementById("distance").value);

  if (!speed || speed <= 0 || isNaN(distance)) {
    document.getElementById("time").innerText =
      "Kontrollera värdena";
    return;
  }

  const totalMinutes =
    Math.round((distance / speed) * 60);

  const hours =
    Math.floor(totalMinutes / 60);

  const minutes =
    totalMinutes - (hours * 60);

  let text = "";

  if (hours > 0)
    text += hours + " tim ";

  text += minutes + " min";

  document.getElementById("time").innerText =
    text;

  document.getElementById("detail").innerText =
    distance + " km med " + speed + " km/h";
}

</script>

</body>
</html>
