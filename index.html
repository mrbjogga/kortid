<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Körtid</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  background: #f2f2f7;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  color: #111;
}

.card {
  width: 90%;
  max-width: 420px;
  background: white;
  padding: 28px;
  border-radius: 24px;
  box-shadow: 0 10px 35px rgba(0,0,0,0.12);
}

h1 { margin: 0 0 8px; font-size: 30px; }

.intro {
  color: #666;
  margin-bottom: 25px;
}

label {
  display: block;
  font-weight: 600;
  margin-top: 18px;
  margin-bottom: 7px;
}

input {
  width: 100%;
  padding: 15px;
  font-size: 21px;
  border: 1px solid #bbb;
  border-radius: 13px;
}

button {
  width: 100%;
  margin-top: 24px;
  padding: 16px;
  border: none;
  border-radius: 14px;
  background: #007aff;
  color: white;
  font-size: 19px;
  font-weight: bold;
  cursor: pointer;
}

.result {
  margin-top: 22px;
  padding: 20px;
  background: #f2f2f7;
  border-radius: 16px;
  text-align: center;
}

.time {
  font-size: 28px;
  font-weight: bold;
}

.detail {
  margin-top: 6px;
  color: #666;
}

.comparison {
  margin-top: 14px;
  padding-top: 14px;
  border-top: 1px solid #ccc;
}

#difference {
  font-size: 22px;
  font-weight: bold;
}
</style>
</head>

<body>

<div class="card">

<h1>🚗 Körtid</h1>

<p class="intro">
Jämför körtiden vid två olika hastigheter.
</p>

<label>Hastighet (km/h)</label>
<input id="speed1" type="number" placeholder="80">

<label>Alternativ hastighet (km/h)</label>
<input id="speed2" type="number" placeholder="100">

<label>Sträcka (km)</label>
<input id="distance" type="number" placeholder="100">

<button onclick="calculate()">Beräkna</button>

<div class="result">

<div class="time" id="time1">–</div>
<div class="detail" id="detail1">Ordinarie hastighet</div>

<div class="comparison">

<div class="time" id="time2">–</div>
<div class="detail" id="detail2">Alternativ hastighet</div>

<br>

<div id="difference">–</div>

</div>
</div>
</div>

<script>

function formatTime(minutes) {
  const hours = Math.floor(minutes / 60);
  const mins = minutes - hours * 60;

  if (hours > 0) {
    return hours + " tim " + mins + " min";
  }

  return mins + " min";
}

function calculate() {

  const speed1 =
    parseFloat(document.getElementById("speed1").value);

  const speed2 =
    parseFloat(document.getElementById("speed2").value);

  const distance =
    parseFloat(document.getElementById("distance").value);

  if (speed1 <= 0 || speed2 <= 0 ||
      distance < 0 ||
      isNaN(speed1) || isNaN(speed2) ||
      isNaN(distance)) {

    document.getElementById("difference").innerText =
      "Kontrollera värdena";

    return;
  }

  const minutes1 =
    Math.round((distance / speed1) * 60);

  const minutes2 =
    Math.round((distance / speed2) * 60);

  document.getElementById("time1").innerText =
    formatTime(minutes1);

  document.getElementById("detail1").innerText =
    distance + " km med " + speed1 + " km/h";

  document.getElementById("time2").innerText =
    formatTime(minutes2);

  document.getElementById("detail2").innerText =
    distance + " km med " + speed2 + " km/h";

  const difference = minutes1 - minutes2;

  if (difference > 0) {

    document.getElementById("difference").innerText =
      "⏱️ Tidsbesparing: " +
      formatTime(difference);

  } else if (difference < 0) {

    document.getElementById("difference").innerText =
      "⏱️ Tidsökning: " +
      formatTime(Math.abs(difference));

  } else {

    document.getElementById("difference").innerText =
      "Samma körtid";
  }
}

</script>

</body>
</html>
