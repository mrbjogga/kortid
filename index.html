<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f2f2f7">
<title>Körtid</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  background: #f2f2f7;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  color: #111;
}

.card {
  width: 90%;
  max-width: 430px;
  background: white;
  padding: 28px;
  border-radius: 24px;
  box-shadow: 0 10px 35px rgba(0,0,0,0.12);
}

h1 {
  margin: 0 0 6px;
  font-size: 30px;
}

.intro {
  color: #666;
  margin: 0 0 25px;
}

label {
  display: block;
  font-weight: 600;
  margin-top: 18px;
  margin-bottom: 7px;
}

.input-wrap {
  position: relative;
}

input {
  width: 100%;
  padding: 15px 75px 15px 15px;
  font-size: 21px;
  border: 1px solid #bbb;
  border-radius: 13px;
  outline: none;
}

input:focus {
  border-color: #007aff;
}

.unit {
  position: absolute;
  right: 15px;
  top: 50%;
  transform: translateY(-50%);
  color: #777;
}

.results {
  margin-top: 25px;
}

.result-row {
  padding: 16px 4px;
  border-bottom: 1px solid #ddd;
}

.result-label {
  color: #666;
  font-size: 14px;
}

.result-time {
  font-size: 24px;
  font-weight: 700;
  margin-top: 3px;
}

.difference {
  margin-top: 20px;
  padding: 20px;
  background: #f2f2f7;
  border-radius: 16px;
  text-align: center;
}

.difference-label {
  color: #666;
  font-size: 14px;
}

#difference {
  margin-top: 5px;
  font-size: 27px;
  font-weight: 800;
}

#difference.saving {
  color: #16833b;
}

#difference.loss {
  color: #c5362f;
}

@media (prefers-color-scheme: dark) {
  body {
    background: #000;
    color: white;
  }

  .card {
    background: #1c1c1e;
  }

  input {
    background: #2c2c2e;
    color: white;
    border-color: #48484a;
  }

  .intro,
  .result-label,
  .difference-label,
  .unit {
    color: #aaa;
  }

  .result-row {
    border-color: #3a3a3c;
  }

  .difference {
    background: #2c2c2e;
  }
}
</style>
</head>

<body>

<div class="card">

<h1>🚗 Körtid</h1>
<p class="intro">Jämför två hastigheter över samma sträcka.</p>

<label for="speed1">Hastighet</label>
<div class="input-wrap">
  <input id="speed1"
         type="number"
         inputmode="decimal"
         placeholder="80">
  <span class="unit">km/h</span>
</div>

<label for="speed2">Alternativ hastighet</label>
<div class="input-wrap">
  <input id="speed2"
         type="number"
         inputmode="decimal"
         placeholder="100">
  <span class="unit">km/h</span>
</div>

<label for="distance">Sträcka</label>
<div class="input-wrap">
  <input id="distance"
         type="number"
         inputmode="decimal"
         placeholder="100">
  <span class="unit">km</span>
</div>

<div class="results">

  <div class="result-row">
    <div class="result-label" id="label1">
      Ordinarie hastighet
    </div>
    <div class="result-time" id="time1">–</div>
  </div>

  <div class="result-row">
    <div class="result-label" id="label2">
      Alternativ hastighet
    </div>
    <div class="result-time" id="time2">–</div>
  </div>

</div>

<div class="difference">
  <div class="difference-label">Skillnad i körtid</div>
  <div id="difference">–</div>
</div>

</div>

<script>

const speed1 = document.getElementById("speed1");
const speed2 = document.getElementById("speed2");
const distance = document.getElementById("distance");

function formatTime(totalMinutes) {

  const hours = Math.floor(totalMinutes / 60);
  const minutes = totalMinutes - (hours * 60);

  if (hours > 0 && minutes > 0) {
    return hours + " tim " + minutes + " min";
  }

  if (hours > 0) {
    return hours + " tim";
  }

  return minutes + " min";
}

function calculate() {

  const s1 = parseFloat(speed1.value);
  const s2 = parseFloat(speed2.value);
  const d = parseFloat(distance.value);

  const difference =
    document.getElementById("difference");

  difference.classList.remove("saving", "loss");

  if (
    isNaN(s1) || isNaN(s2) || isNaN(d) ||
    s1 <= 0 || s2 <= 0 || d < 0
  ) {

    document.getElementById("time1").textContent = "–";
    document.getElementById("time2").textContent = "–";
    difference.textContent = "–";

    return;
  }

  const minutes1 = Math.round((d / s1) * 60);
  const minutes2 = Math.round((d / s2) * 60);

  document.getElementById("time1").textContent =
    formatTime(minutes1);

  document.getElementById("time2").textContent =
    formatTime(minutes2);

  document.getElementById("label1").textContent =
    s1 + " km/h";

  document.getElementById("label2").textContent =
    s2 + " km/h";

  const diff = minutes1 - minutes2;

  if (diff > 0) {

    difference.textContent =
      "Sparar " + formatTime(diff);

    difference.classList.add("saving");

  } else if (diff < 0) {

    difference.textContent =
      "Tar " + formatTime(Math.abs(diff)) + " längre";

    difference.classList.add("loss");

  } else {

    difference.textContent = "Samma körtid";
  }
}

speed1.addEventListener("input", calculate);
speed2.addEventListener("input", calculate);
distance.addEventListener("input", calculate);

</script>

</body>
</html>
